<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sin conexión · Balneario</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f3ec; color: #1c2830;
         padding: 24px; box-sizing: border-box; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #0e1418; color: #e6edf0; } p { color: #9cadb6; } }
  img { width: 96px; height: 96px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #56666f; margin: 0 0 20px; max-width: 320px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 20px; background: #0b6a87; color: #fff; }
</style>
</head>
<body>
  <div>
    <img src="/logo.png" alt="">
    <h1>Sin conexión</h1>
    <p>Para ver reservas y caja actualizadas hace falta internet. Nada de lo que hiciste se perdió: está guardado en el servidor.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>

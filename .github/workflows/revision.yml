name: Revisión del sitio en producción

on:
  workflow_dispatch:
  push:
    paths: ["scripts/revision.mjs", ".github/workflows/revision.yml"]

permissions:
  contents: write

jobs:
  revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # La demo se prueba contra una base Supabase propia, armada acá con el instalador.
      # (La base real exige la casilla de Cloudflare también del lado del servidor, así que un robot no puede entrar.)
      - name: Base Supabase de prueba
        run: |
          mkdir -p /tmp/sb && cd /tmp/sb
          npx -y supabase@2 init --force >/dev/null
          sed -i 's/^enable_anonymous_sign_ins = false/enable_anonymous_sign_ins = true/' supabase/config.toml
          npx -y supabase@2 start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta
          npx -y supabase@2 status -o env > /tmp/sb/env.txt
          API=$(grep '^API_URL=' env.txt | cut -d'"' -f2); KEY=$(grep -E '^(PUBLISHABLE_KEY|ANON_KEY)=' env.txt | head -1 | cut -d'"' -f2)
          echo "NEXT_PUBLIC_SUPABASE_URL=$API" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$KEY" >> $GITHUB_ENV
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -q -v ON_ERROR_STOP=1 -f $GITHUB_WORKSPACE/supabase/instalar.sql
          echo "Base lista en $API"
      - run: npm install --no-audit --no-fund && npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Recorrer el sitio
        run: |
          NEXT_PUBLIC_SITE_URL=http://localhost:3000 npm start &
          npx -y wait-on@8 http://localhost:3000/inicio --timeout 60000
          DEMO_URL=http://localhost:3000 HEADLESS=1 node scripts/revision.mjs
      - name: Guardar el informe en la rama "revision"
        if: always()
        run: |
          cd revision
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init -q -b revision
          git config user.name "revision" && git config user.email "revision@users.noreply.github.com"
          git add -A && git commit -qm "Revisión de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" revision

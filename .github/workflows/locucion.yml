name: Locución para video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  locucion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade edge-tts
      - name: Generar locución (una sola toma, con tiempos de cada palabra)
        run: |
          mkdir -p locucion
          python - <<'PY'
          import asyncio, json, edge_tts
          c = json.load(open("scripts/video/locucion.json", encoding="utf-8"))
          async def main():
              for v in c["voces"]:
                  com = edge_tts.Communicate(c["texto"], v["voz"], rate=v["velocidad"], pitch=v["tono"], boundary="WordBoundary")
                  words = []
                  with open(f"locucion/{v['nombre']}.mp3", "wb") as f:
                      async for ch in com.stream():
                          if ch["type"] == "audio": f.write(ch["data"])
                          elif ch["type"] == "WordBoundary": words.append({"t": ch["offset"] / 1e7, "d": ch["duration"] / 1e7, "w": ch["text"]})
                  json.dump(words, open(f"locucion/{v['nombre']}.json", "w"), ensure_ascii=False, indent=0)
          asyncio.run(main())
          PY
          ls -la locucion
      - name: Guardar en la rama "locucion"
        run: |
          cd locucion
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init -q -b locucion
          git config user.name "locucion" && git config user.email "locucion@users.noreply.github.com"
          git add -A && git commit -qm "Locución de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" locucion

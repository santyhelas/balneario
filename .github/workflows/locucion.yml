name: Locución para video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  locucion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts==7.0.2
      - name: Generar frases
        run: |
          mkdir -p locucion
          python - <<'PY'
          import json, subprocess
          c = json.load(open("scripts/video/locucion.json", encoding="utf-8"))
          for k, t in c["frases"].items():
              for voz in [c["voz"], "es-AR-ElenaNeural"]:
                  subprocess.run(["edge-tts", "--voice", voz, f"--rate={c['velocidad']}", f"--pitch={c['tono']}", "--text", t,
                                  "--write-media", f"locucion/{voz}-{k}.mp3"], check=True)
          PY
          ls -la locucion
      - name: Guardar en la rama "locucion"
        run: |
          cd locucion
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init -q -b locucion
          git config user.name "locucion" && git config user.email "locucion@users.noreply.github.com"
          git add -A && git commit -qm "Locución de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" locucion

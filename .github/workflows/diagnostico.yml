name: Diagnóstico del sitio
on: workflow_dispatch
jobs:
  urls:
    runs-on: ubuntu-latest
    steps:
      - name: Redirecciones
        run: |
          for u in https://mibalneario.com.ar/api/drive/conectar http://mibalneario.com.ar/ https://www.mibalneario.com.ar/ http://www.mibalneario.com.ar/ https://mibalneario.com.ar/ https://mibalneario.com.ar/inicio https://mibalneario.com.ar/terminos https://mibalneario.com.ar/privacidad https://mibalneario.com.ar/login https://mibalneario.com.ar/copias https://mibalneario.com.ar/mapa https://mibalneario.com.ar/terminos/ https://mibalneario.com.ar/index.html https://mibalneario.vercel.app/; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$u")"
          done
          curl -s https://mibalneario.com.ar/sitemap.xml; echo; curl -s https://mibalneario.com.ar/robots.txt
          curl -s https://mibalneario.com.ar/ | grep -o '<link rel="canonical"[^>]*>' || echo "sin canonical"

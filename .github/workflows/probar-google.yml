name: Probar como Google
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          for u in / /sistema-para-balnearios/mar-del-plata /presupuesto /sitemap.xml /robots.txt; do
            echo "=== $u"
            curl -sS -A "$UA" -D - -o /tmp/b.html "https://mibalneario.com.ar$u" | grep -iE "^HTTP|^location|robots|^content-type|^x-vercel|^server|^cache-control|^set-cookie" | cut -c1-200
            grep -o '<meta name="robots"[^>]*>' /tmp/b.html | head -2; grep -o '<title>[^<]*' /tmp/b.html | head -1
          done

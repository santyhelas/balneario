name: Probar sitemap
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ua in "Mozilla/5.0 (compatible; Googlebot/2.0; +http://www.google.com/bot.html)" "curl/8"; do
            echo "== $ua"
            curl -sS -A "$ua" -o /tmp/s.xml -w "HTTP %{http_code} · %{content_type} · %{size_download} bytes · redirige a: %{redirect_url}\n" https://mibalneario.com.ar/sitemap.xml
            head -c 600 /tmp/s.xml; echo
            curl -sS -A "$ua" -o /dev/null -w "www → HTTP %{http_code} %{redirect_url}\n" https://www.mibalneario.com.ar/sitemap.xml
          done
          curl -sS https://mibalneario.com.ar/robots.txt

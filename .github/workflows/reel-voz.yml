name: Reel - voz
on:
  workflow_dispatch:
    inputs:
      voz: { default: "es-AR-TomasNeural" }
      velocidad: { default: "+10%" }
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts && mkdir -p out && python scripts/reel/voz.py "${{ inputs.voz }}" "${{ inputs.velocidad }}"
      - uses: actions/upload-artifact@v4
        with: { name: voz, path: out/ }

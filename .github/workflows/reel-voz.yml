name: Reel - voz
on:
  workflow_dispatch:
    inputs:
      voz: { default: "es-AR-TomasNeural" }
      velocidad: { default: "+10%" }
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts && mkdir -p out && python scripts/reel/voz.py "${{ inputs.voz }}" "${{ inputs.velocidad }}"
      - name: Guardar en la rama "reel-voz"
        run: |
          cd out
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init -q -b reel-voz
          git config user.name "reel" && git config user.email "reel@users.noreply.github.com"
          git add -A && git commit -qm "Voz ${{ inputs.voz }} ${{ inputs.velocidad }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" reel-voz
